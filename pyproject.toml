[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-calib"
version = "0.1.0"
description = "CPU-only targetless calibration for overlapping RGB-D cameras"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "open3d>=0.17",
]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.54"]
gui = ["ttkbootstrap>=1.10"]

[project.gui-scripts]
icp-calib-gui = "icp_calib.gui:main"

[project.scripts]
icp-calib-realsense-extrinsics = "icp_calib.realsense_extrinsics:main"

[tool.setuptools.packages.find]
include = ["icp_calib*"]
